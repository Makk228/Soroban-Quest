# Конфигурация приложения. Все чувствительные значения приходят из переменных
# окружения: в коде и в репозитории секретов нет.
spring:
  application:
    name: soroban-quest

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/soroban}
    username: ${DATABASE_USER:soroban}
    password: ${DATABASE_PASSWORD:soroban}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      pool-name: soroban-pool

  # Миграции лежат внутри модулей: каждый модуль владеет своей схемой в БД.
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/identity
      - classpath:db/migration/training
      - classpath:db/migration/progression
      - classpath:db/migration/leaderboard

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
  shutdown: graceful

soroban:
  identity:
    jwt-secret: ${SOROBAN_JWT_SECRET:}
    jwt-issuer: ${SOROBAN_JWT_ISSUER:soroban-quest}
    access-token-ttl: ${SOROBAN_ACCESS_TOKEN_TTL:PT30M}
    refresh-token-ttl: ${SOROBAN_REFRESH_TOKEN_TTL:P30D}
    bcrypt-strength: ${SOROBAN_BCRYPT_STRENGTH:10}
  training:
    max-active-sessions: ${SOROBAN_MAX_ACTIVE_SESSIONS:5}
    min-task-count: 5
    max-task-count: 50
  progression:
    time-zone: ${SOROBAN_TIME_ZONE:UTC}
  leaderboard:
    time-zone: ${SOROBAN_TIME_ZONE:UTC}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.sorobanquest: ${LOG_LEVEL:INFO}
